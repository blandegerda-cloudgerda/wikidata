
<!DOCTYPE html>
<html lang="et">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Wikidata filmide visualiseeringud</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f9;
      color: #263238;
      margin: 0;
      padding: 0;
    }

    header {
      background: #24476b;
      color: white;
      text-align: center;
      padding: 35px 20px;
    }

    main {
      max-width: 1050px;
      margin: 30px auto;
      padding: 0 20px;
    }

    section {
      background: white;
      border-radius: 12px;
      padding: 25px;
      margin-bottom: 25px;
      box-shadow: 0 2px 8px #00000012;
    }

    h2 {
      color: #24476b;
    }

    iframe {
      width: 100%;
      height: 550px;
      border: none;
      border-radius: 8px;
    }

    footer {
      text-align: center;
      padding: 20px;
      color: #777;
    }
  </style>
</head>

<body>

  <header>
    <h1>Filmid ja nende seosed Wikidatas</h1>
    <p>Wikidata andmete visualiseerimine</p>
  </header>

  <main>

    <section>
      <h2>Filmide ja näitlejate võrgustik</h2>

      <p>
        Võrgustik näitab filmi Volver (2006)
        ja selles osalenud näitlejate seoseid.
        Iga sõlm tähistab filmi või näitlejat.
      </p>

      <iframe
        title="Filmi Volver võrgustik"
        src="https://query.wikidata.org/embed.html#%23defaultView%3AGraph%0ASELECT%20%3Ffilm%20%3FfilmLabel%20%3Fnaitleja%20%3FnaitlejaLabel%0AWHERE%20%7B%0A%20%20VALUES%20%3Ffilm%20%7B%20wd%3AQ209667%20%7D%0A%20%20%3Ffilm%20wdt%3AP161%20%3Fnaitleja.%0A%20%20SERVICE%20wikibase%3Alabel%20%7B%0A%20%20%20%20bd%3AserviceParam%20wikibase%3Alanguage%20%22es%2Cen%22.%0A%20%20%7D%0A%7D">
      </iframe>

    </section>

  </main>

  <footer>
    Digihumanitaaria – Wikidata praktiline töö
  </footer>

</body>
</html>
